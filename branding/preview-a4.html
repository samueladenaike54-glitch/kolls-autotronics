<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orion X A4 sticker sheet preview</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #e8e8e1;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 40px;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #292a26;
    }
    .sheet {
      display: block;
      width: 700px;
      height: auto;
      box-shadow: 0 24px 44px rgba(21, 22, 20, 0.2);
      background: #fff;
    }
    .caption {
      text-align: center;
      line-height: 1.45;
    }
    .caption strong {
      display: block;
      font-size: 20px;
    }
    .caption span {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6f7169;
    }
  </style>
</head>
<body>
  <img class="sheet" src="orion-x-sticker-a4.svg" alt="A4 sheet of Orion X stickers">
  <div class="caption">
    <strong>A4 sticker sheet</strong>
    <span>12 up · 60 × 60 mm · print at 100%</span>
  </div>
</body>
</html>
