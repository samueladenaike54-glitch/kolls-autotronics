<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orion X sticker preview</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #e8e8e1;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 40px;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #292a26;
    }
    .sticker-wrap {
      width: 600px;
      height: 600px;
      border-radius: 78px;
      overflow: hidden;
      background: #151614;
      box-shadow: 0 26px 38px rgba(21, 22, 20, 0.24);
    }
    .sticker {
      display: block;
      width: 600px;
      height: 600px;
    }
    .caption {
      text-align: center;
      line-height: 1.45;
    }
    .caption strong {
      display: block;
      font-size: 22px;
      letter-spacing: 0.02em;
    }
    .caption span {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6f7169;
    }
  </style>
</head>
<body>
  <div class="sticker-wrap">
    <img class="sticker" src="orion-x-sticker.png" alt="Orion X sticker">
  </div>
  <div class="caption">
    <strong>Orion X</strong>
    <span>60 × 60 mm · vector sticker</span>
  </div>
</body>
</html>
