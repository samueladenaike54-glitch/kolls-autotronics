<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" xmlns="http://www.w3.org/2000/svg">
<style>
  :root {
    --bg: #0b1220; --card: #162033; --border: #334155; --fg: #e5e7eb; --muted: #94a3b8;
    --power: #ef4444; --gnd: #cbd5e1; --can-h: #f59e0b; --can-l: #3b82f6;
    --spi: #a78bfa; --data: #10b981; --unused: #64748b; --cut: #ef4444; --brand: #22d3ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  header { text-align: center; margin-bottom: 8px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; color: var(--brand); }
  h2 { font-size: 1.05rem; margin: 26px 0 8px; color: var(--brand); }
  .sub { color: var(--muted); font-size: .9rem; }
  svg { width: 100%; max-width: 1080px; display: block; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .comp { fill: #1e293b; stroke: var(--border); stroke-width: 2; rx: 8; }
  .wire { fill: none; stroke-width: 2.5; }
  text  { fill: var(--fg); font-family: ui-monospace, monospace; }
  .lbl  { font-size: 12px; font-weight: 700; }
  .pin  { font-size: 10px; fill: var(--muted); }
  .note { font-size: 10px; fill: var(--muted); }
  .cutx { stroke: var(--cut); stroke-width: 2.5; }
  table { width: 100%; max-width: 1080px; margin: 10px auto 0; border-collapse: collapse; font-size: .82rem; }
  th, td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  th { background: #1e293b; color: var(--brand); }
  .ok { color: #4ade80; } .warn { color: #fbbf24; } .crit { color: #f87171; }
  ul.check { max-width: 1080px; margin: 10px auto; font-size: .85rem; color: var(--muted); line-height: 1.75; }

text{font-family:ui-monospace,Consolas,monospace}</style>

  <!-- ---------- divider column (far right) ---------- -->
  <text class="lbl" x="900" y="30" fill="#fbbf24" text-anchor="middle">FUEL GAUGE DIVIDER</text>

  <path class="wire" d="M145 313 V120 H950" stroke="#fbbf24"/>
  <text class="note" x="160" y="112" fill="#fbbf24">sense tap ← battery +</text>

  <rect x="950" y="106" width="70" height="28" fill="#1e293b" stroke="#fbbf24"/>
  <text class="pin" x="985" y="124" text-anchor="middle" fill="#fbbf24">R1 100k</text>
  <path class="wire" d="M1020 120 H1040" stroke="#fbbf24"/>
  <circle cx="1040" cy="120" r="4.5" fill="#fbbf24"/>
  <text class="note" x="830" y="152" fill="#fbbf24">node → GPIO34 (ADC1)</text>

  <path class="wire" d="M1040 120 H980 V150" stroke="#fbbf24"/>
  <rect x="960" y="150" width="40" height="60" fill="#1e293b" stroke="#fbbf24"/>
  <text class="pin" x="980" y="176" text-anchor="middle" fill="#fbbf24">R2</text>
  <text class="pin" x="980" y="190" text-anchor="middle" fill="#fbbf24">100k</text>
  <path class="wire" d="M980 210 V560" stroke="#fbbf24"/>

  <g stroke="#94a3b8" stroke-dasharray="3,3">
    <line x1="1015" y1="160" x2="1015" y2="200"/>
    <line x1="1007" y1="160" x2="1023" y2="160"/>
    <line x1="1007" y1="200" x2="1023" y2="200"/>
  </g>
  <text class="note" x="905" y="235" fill="#94a3b8">C1 100nF (optional)</text>

  <path class="wire" d="M1040 120 V500 H660 V415 H700" stroke="#fbbf24"/>

  <!-- ---------- battery ---------- -->
  <rect class="comp" x="30" y="290" width="115" height="105" stroke="#ef4444"/>
  <text class="lbl" x="87" y="316" text-anchor="middle" fill="#ef4444">18650 PACK</text>
  <text class="pin" x="87" y="333" text-anchor="middle">3.0 – 4.2 V</text>
  <text class="pin" x="87" y="350" text-anchor="middle">Li-ion</text>
  <circle cx="145" cy="313" r="4.5" fill="#ef4444"/>
  <circle cx="145" cy="375" r="4.5" fill="#cbd5e1"/>
  <text class="pin" x="154" y="317" fill="#ef4444">+</text>
  <text class="pin" x="154" y="379" fill="#94a3b8">−</text>
  <text class="note" x="87" y="415" text-anchor="middle" fill="#94a3b8">OPTION B: 2 cells</text>
  <text class="note" x="87" y="428" text-anchor="middle" fill="#94a3b8">in series → LM2596</text>

  <!-- ---------- diode ---------- -->
  <path class="wire" d="M145 313 H195" stroke="#fbbf24"/>
  <path d="M195 301 L195 325 L232 313 Z" fill="#fbbf24" stroke="#fbbf24"/>
  <line x1="232" y1="299" x2="232" y2="327" stroke="#fbbf24" stroke-width="2.5"/>
  <path class="wire" d="M232 313 H285" stroke="#ef4444"/>
  <text class="note" x="213" y="291" text-anchor="middle" fill="#fbbf24">D1 · 1N5819</text>
  <text class="note" x="200" y="350" text-anchor="middle" fill="#94a3b8">reverse guard</text>

  <!-- ---------- DC-DC module ---------- -->
  <rect class="comp" x="285" y="285" width="150" height="56" stroke="#f97316"/>
  <text class="lbl" x="360" y="308" text-anchor="middle" fill="#f97316">DC-DC MODULE</text>
  <text class="pin" x="360" y="327" text-anchor="middle">OUT = 5.0 V</text>
  <circle cx="285" cy="313" r="4.5" fill="#ef4444"/>
  <circle cx="285" cy="343" r="4.5" fill="#cbd5e1"/>
  <circle cx="435" cy="313" r="4.5" fill="#ef4444"/>
  <circle cx="435" cy="343" r="4.5" fill="#cbd5e1"/>
  <text class="pin" x="270" y="306" text-anchor="end" fill="#ef4444">IN+</text>
  <text class="pin" x="270" y="357" text-anchor="end" fill="#94a3b8">IN−</text>
  <text class="pin" x="450" y="306" fill="#ef4444">OUT+</text>
  <text class="pin" x="450" y="357" fill="#94a3b8">OUT−</text>
  <text class="note" x="360" y="368" text-anchor="middle" fill="#94a3b8">1 cell → boost</text>
  <text class="note" x="360" y="381" text-anchor="middle" fill="#94a3b8">2 cells → LM2596</text>

  <!-- ---------- fuse ---------- -->
  <path class="wire" d="M435 313 H490" stroke="#ef4444"/>
  <rect x="490" y="301" width="70" height="26" fill="#1e293b" stroke="#ef4444"/>
  <text class="pin" x="525" y="318" text-anchor="middle" fill="#ef4444">5A FUSE</text>
  <path class="wire" d="M560 313 H640 V280 H700" stroke="#ef4444"/>
  <text class="note" x="600" y="305" fill="#ef4444">5.0 V</text>

  <!-- ---------- ESP32 power view ---------- -->
  <rect class="comp" x="700" y="180" width="200" height="280" stroke="#10b981"/>
  <text class="lbl" x="800" y="205" text-anchor="middle" fill="#10b981">ESP32 (power view)</text>
  <text class="pin" x="708" y="284">VIN ← 5.0 V</text>
  <text class="pin" x="708" y="329">GND</text>
  <text class="pin" x="708" y="369">3V3 (onboard LDO out)</text>
  <text class="pin" x="708" y="419">GPIO34 ← ADC1 (divider)</text>
  <text class="note" x="708" y="440" fill="#f87171">⚠ VIN needs &gt; ~4.3 V —</text>
  <text class="note" x="708" y="453" fill="#f87171">1 cell + diode alone browns out.</text>
  <circle cx="700" cy="280" r="4.5" fill="#ef4444"/>
  <circle cx="700" cy="325" r="4.5" fill="#cbd5e1"/>
  <circle cx="700" cy="415" r="4.5" fill="#fbbf24"/>

  <!-- ---------- ground bus ---------- -->
  <line class="wire" x1="40" y1="560" x2="1060" y2="560" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10,5"/>
  <text class="pin" x="40" y="550" fill="#94a3b8">GND: battery − · module IN−/OUT− · ESP32 GND · R2 · OBD pin 4/5 (sheet 1)</text>
  <path class="wire" d="M145 375 H185 V560" stroke="#cbd5e1" stroke-dasharray="6,3"/>
  <path class="wire" d="M285 343 H255 V560" stroke="#cbd5e1" stroke-dasharray="6,3"/>
  <path class="wire" d="M435 343 H470 V560" stroke="#cbd5e1" stroke-dasharray="6,3"/>
  <path class="wire" d="M700 325 H680 V560" stroke="#cbd5e1" stroke-dasharray="6,3"/>
  <line class="wire" x1="205" y1="560" x2="205" y2="578" stroke="#cbd5e1"/>
  <line class="wire" x1="192" y1="578" x2="218" y2="578" stroke="#cbd5e1"/>
  <line class="wire" x1="197" y1="584" x2="213" y2="584" stroke="#cbd5e1"/>
  <line class="wire" x1="202" y1="590" x2="208" y2="590" stroke="#cbd5e1"/>

  <!-- ---------- notes ---------- -->
  <rect x="30" y="600" width="540" height="100" fill="#1a1024" stroke="#f87171"/>
  <text class="lbl" x="48" y="623" fill="#f87171">POWER RULES</text>
  <text class="pin" x="48" y="644" fill="#e5e7eb">1. Never feed OBD pin 16 (+12 V) to the ESP32 or the module output side.</text>
  <text class="pin" x="48" y="665" fill="#e5e7eb">2. Set the module to 5.0 V with a multimeter BEFORE connecting ESP32 VIN.</text>
  <text class="pin" x="48" y="686" fill="#e5e7eb">3. GND must stay common with the car (OBD 4/5) even though power is battery.</text>

  <rect x="620" y="600" width="440" height="100" fill="#0f172a" stroke="#334155"/>
  <text class="pin" x="640" y="623" fill="#fbbf24">device_v = analogReadMilliVolts(GPIO34) × 2.0 / 1000</text>
  <text class="pin" x="640" y="644" fill="#94a3b8">100k / 100k divider ⇒ ratio 2.0 (DEVICE_BATT_RATIO)</text>
  <text class="pin" x="640" y="665" fill="#94a3b8">No divider wired yet? Set DEVICE_BATT_MONITOR 0 in the sketch.</text>
  <text class="pin" x="640" y="686" fill="#94a3b8">Warn &lt; 3.40 V · Critical &lt; 3.10 V · 3.20 V = 0% · 4.20 V = 100%</text>
</svg>